<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Signing out&hellip; · CCA Guide</title>
</head>
<body>
<script>
  // Clear every sign-in flag we've ever issued -- the original key and all
  // of its numbered rotations -- so rotating doesn't leave dead entries
  // behind, then send the user back to the login page.
  try {
    for (var i = localStorage.length - 1; i >= 0; i--) {
      var k = localStorage.key(i);
      if (k && /^cca_ok\d*$/.test(k)) localStorage.removeItem(k);
    }
  } catch (e) {}
  try { if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); } catch (e) {}
  location.replace('/cca/login/');
</script>
</body>
</html>
