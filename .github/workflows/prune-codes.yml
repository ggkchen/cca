name: Prune Access Codes

# Sweeps lapsed temporary codes out of docs/access-codes.json once an hour.
# Expiry is already enforced on the login page; this stops the published file
# from carrying hashes for codes that died days ago. Cron on GitHub is
# best-effort and often runs late, so a code can outlive its entry in the file
# by a while -- the login page's own expiry check is what actually gates it.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Shared with the issuer so the two can never write the file at once.
concurrency:
  group: access-codes
  cancel-in-progress: false

jobs:
  prune:
    name: Prune
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Drop lapsed codes
        id: prune
        run: python3 .github/scripts/prune_access_codes.py

      - name: Commit and push
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "nothing to prune"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(access): prune lapsed temporary codes"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger docs deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-and-deploy-docs.yml --ref main
